name: Build and Publish OCI Container with Podman

on:
  push:
    branches: ['main', 'master', 'test']
  pull_request:
    branches: ['main', 'master', 'test']

jobs:
  lint:
    name: Lint Containerfiles
    runs-on: debian-12
    strategy:
      matrix:
        containerfile: [Containerfile, Containerfile.rust, Containerfile.rust-wasm, Containerfile.web-gpu]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mise tools
        uses: jdx/mise-action@v2

      - name: Lint ${{ matrix.containerfile }}
        run: hadolint --config .hadolint.yaml ${{ matrix.containerfile }}

  build-and-push:
    name: Build and push images
    needs: lint
    if: github.event_name == 'push'
    runs-on: debian-12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          apt-get update
          apt-get -y install podman

      - name: Configure rootless containers
        run: |
          mkdir -p $HOME/.local/share/containers/storage
          mkdir -p $HOME/.config/containers

          cat > $HOME/.config/containers/storage.conf << EOF
          [storage]
          driver = "vfs"
          runroot = "$HOME/.local/share/containers/storage"
          graphroot = "$HOME/.local/share/containers/storage"
          EOF

          cat > $HOME/.config/containers/containers.conf << EOF
          [engine]
          cgroup_manager = "cgroupfs"
          events_logger = "file"
          runtime = "runc"
          EOF

      # Local tags are always "claude-code:*" regardless of this repo's own
      # name, because Containerfile.rust and Containerfile.rust-wasm hardcode
      # `FROM claude-code:...` — tagging with github.event.repository.name
      # here would break those dependent builds.
      - name: Build the base image
        run: |
          podman build -f ./Containerfile \
          -t claude-code:latest \
          -t claude-code:${{ github.sha }} \
          .

      - name: Smoke test the base image
        run: podman run --rm claude-code:latest --version

      - name: Build the Rust image
        run: |
          podman build -f ./Containerfile.rust \
          -t claude-code:rust \
          -t claude-code:rust-${{ github.sha }} \
          .

      - name: Smoke test the Rust image
        run: podman run --rm claude-code:rust --version

      - name: Build the Rust + WASM image
        run: |
          podman build -f ./Containerfile.rust-wasm \
          -t claude-code:rust-wasm \
          -t claude-code:rust-wasm-${{ github.sha }} \
          .

      - name: Smoke test the Rust + WASM image
        run: podman run --rm claude-code:rust-wasm --version

      - name: Build the web-gpu image
        run: |
          podman build -f ./Containerfile.web-gpu \
          -t claude-code:web-gpu \
          -t claude-code:web-gpu-${{ github.sha }} \
          .

      - name: Smoke test the web-gpu image
        run: |
          podman run --rm claude-code:web-gpu --version
          podman run --rm --entrypoint chromium claude-code:web-gpu --version

      - name: Log in to Gitea Container Registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ github.server_url }}
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGE_REGISTRY_TOKEN }}

      - name: Push base image
        uses: redhat-actions/push-to-registry@v2
        with:
          image: claude-code
          tags: latest ${{ github.sha }}
          registry: ${{ github.server_url }}

      - name: Push Rust image
        uses: redhat-actions/push-to-registry@v2
        with:
          image: claude-code
          tags: rust rust-${{ github.sha }}
          registry: ${{ github.server_url }}

      - name: Push Rust + WASM image
        uses: redhat-actions/push-to-registry@v2
        with:
          image: claude-code
          tags: rust-wasm rust-wasm-${{ github.sha }}
          registry: ${{ github.server_url }}

      - name: Push web-gpu image
        uses: redhat-actions/push-to-registry@v2
        with:
          image: claude-code
          tags: web-gpu web-gpu-${{ github.sha }}
          registry: ${{ github.server_url }}
