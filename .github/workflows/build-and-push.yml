name: Build and Publish OCI Images

on:
  push:
    branches: ['main', 'master', 'test']
  pull_request:
    branches: ['main', 'master', 'test']

jobs:
  lint:
    name: Lint Containerfiles
    runs-on: ubuntu-latest
    strategy:
      matrix:
        containerfile: [Containerfile, Containerfile.rust, Containerfile.rust-wasm, Containerfile.web-gpu]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mise tools
        uses: jdx/mise-action@v2

      - name: Lint ${{ matrix.containerfile }}
        run: hadolint --config .hadolint.yaml ${{ matrix.containerfile }}

  build-and-push:
    name: Build and push images
    needs: lint
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # A `docker-container` buildx builder is required for the `gha` cache
      # backend below (the default `docker` driver only supports the
      # `inline` cache exporter). It's only usable for the base image: that
      # driver runs BuildKit in its own isolated container with no view of
      # the host Docker Engine's image store, so a later `FROM
      # claude-code:...` referencing a `load: true`'d local image fails as a
      # registry pull instead (confirmed in CI — buildx's `build-contexts`
      # `docker-image://` workaround for this does NOT help: it still
      # resolves via registry rather than the engine's local store). The
      # base image's `FROM debian:trixie-slim` is a public image with no
      # such local-chain dependency, so it's the only one of the three that
      # can safely use this builder/cache combo.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Local tags are always "claude-code:*" regardless of this repo's own
      # name, because Containerfile.rust and Containerfile.rust-wasm hardcode
      # `FROM claude-code:...`. `load: true` keeps each build in the local
      # Docker daemon so the next Containerfile in the chain can resolve it.
      - name: Build the base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          load: true
          tags: claude-code:latest
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      - name: Smoke test the base image
        run: docker run --rm claude-code:latest --version

      # Switch back to the default (plain `docker`) builder for the rest of
      # the chain: it builds directly against the Docker Engine, so it does
      # see the `claude-code:latest` image `load: true`'d above. No GHA
      # cache here — that backend needs the docker-container driver, which
      # breaks this local-image resolution (see comment above).
      - name: Switch to the default Docker builder
        run: docker buildx use default

      - name: Build the Rust image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile.rust
          load: true
          tags: claude-code:rust

      - name: Smoke test the Rust image
        run: docker run --rm claude-code:rust --version

      - name: Build the Rust + WASM image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile.rust-wasm
          load: true
          tags: claude-code:rust-wasm

      - name: Smoke test the Rust + WASM image
        run: docker run --rm claude-code:rust-wasm --version

      - name: Build the web-gpu image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile.web-gpu
          load: true
          tags: claude-code:web-gpu

      - name: Smoke test the web-gpu image
        run: |
          docker run --rm claude-code:web-gpu --version
          docker run --rm --entrypoint chromium claude-code:web-gpu --version

      - name: Compute image name
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push base image
        run: |
          docker tag claude-code:latest ${{ steps.image.outputs.name }}:latest
          docker tag claude-code:latest ${{ steps.image.outputs.name }}:${{ github.sha }}
          docker push ${{ steps.image.outputs.name }}:latest
          docker push ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Tag and push Rust image
        run: |
          docker tag claude-code:rust ${{ steps.image.outputs.name }}:rust
          docker tag claude-code:rust ${{ steps.image.outputs.name }}:rust-${{ github.sha }}
          docker push ${{ steps.image.outputs.name }}:rust
          docker push ${{ steps.image.outputs.name }}:rust-${{ github.sha }}

      - name: Tag and push Rust + WASM image
        run: |
          docker tag claude-code:rust-wasm ${{ steps.image.outputs.name }}:rust-wasm
          docker tag claude-code:rust-wasm ${{ steps.image.outputs.name }}:rust-wasm-${{ github.sha }}
          docker push ${{ steps.image.outputs.name }}:rust-wasm
          docker push ${{ steps.image.outputs.name }}:rust-wasm-${{ github.sha }}

      - name: Tag and push web-gpu image
        run: |
          docker tag claude-code:web-gpu ${{ steps.image.outputs.name }}:web-gpu
          docker tag claude-code:web-gpu ${{ steps.image.outputs.name }}:web-gpu-${{ github.sha }}
          docker push ${{ steps.image.outputs.name }}:web-gpu
          docker push ${{ steps.image.outputs.name }}:web-gpu-${{ github.sha }}
