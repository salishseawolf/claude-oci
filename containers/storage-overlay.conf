# Faster alternative to storage.conf, selected by entrypoint.sh (via
# CONTAINERS_STORAGE_CONF) when the container was started with
# `--device /dev/fuse`. fuse-overlayfs shares layers copy-on-write instead of
# copying the whole filesystem per layer like vfs.
#
# Separate graphroot/runroot from the vfs config: containers/storage refuses
# to open a store created by a different driver, and a persisted
# /var/lib/containers volume may hold either.
[storage]
driver = "overlay"
runroot = "/run/containers/storage-overlay"
graphroot = "/var/lib/containers/storage-overlay"

[storage.options.overlay]
mount_program = "/usr/bin/fuse-overlayfs"
# Same single-UID-mapping caveat as the vfs config.
ignore_chown_errors = "true"
