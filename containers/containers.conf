# Nested-container-friendly engine settings. Based on the Gitea CI runner's
# configuration in .gitea/workflows/build-and-push.yml, except the runtime:
# crun, not runc, because runc refuses `cgroups = "disabled"` below
# ("requested OCI runtime runc is not compatible with NoCgroups").
[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"

# Nested containers share the outer container's network namespace. A private
# one needs pasta or slirp4netns, which need /dev/net/tun; the outer
# container doesn't get that device, so `podman run` fails with "Failed to
# open() /dev/net/tun". The outer container still isolates the network from
# the host. Same choice as the upstream quay.io/podman/stable image.
[containers]
netns = "host"
# The outer container mounts /sys/fs/cgroup read-only, so the runtime can't create
# cgroups for nested containers ("mkdir /sys/fs/cgroup/libpod_parent:
# read-only file system"). Run them in the outer container's cgroup instead.
# Trade-off: no per-container resource limits on nested containers. Same as
# quay.io/podman/stable.
cgroups = "disabled"
# The other namespaces (UTS, IPC, user, cgroup) stay at Podman's defaults:
# with the outer container's --cap-add=SYS_ADMIN, nested Podman can create
# them, so they don't need sharing (verified one by one).
# No journald in the container.
log_driver = "k8s-file"
